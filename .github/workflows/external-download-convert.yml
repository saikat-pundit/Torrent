name: External Video Download Link
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to download'
        required: true
        type: string
        default: 'Paste Your Link'
      output_filename:
        description: 'Output filename (without extension)'
        required: true
        type: string
        default: 'video'
      quality:
        description: 'Video Quality'
        required: true
        type: choice
        default: '480p-av1'
        options:
          - 'original'
          - '480p-av1'
          - '720p-av1'
      upload_to:
        description: 'Upload to'
        required: true
        type: choice
        default: 'release'
        options:
          - 'artifacts'
          - 'release'

jobs:
  convert-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Cache apt packages
      uses: actions/cache@v3
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install FFmpeg and SVT-AV1
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
        # Install SVT-AV1 for AV1 encoding
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y libsvtav1enc-dev libsvtav1dec0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
      # Add requests if not in requirements.txt
      continue-on-error: true
    
    - name: Install Python requests if missing
      run: |
        pip install requests
    
    - name: Run video download and conversion
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
        OUTPUT_FILENAME: ${{ github.event.inputs.output_filename }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        python scripts/download_and_convert.py
    
    - name: Get Output Filename
      id: get_output
      run: |
        if [ -f "output_filename.txt" ]; then
          output=$(cat output_filename.txt)
          echo "output_filename=$output" >> $GITHUB_OUTPUT
          echo "Found output: $output"
        else
          # Fallback to guessing the filename
          if [ "${{ github.event.inputs.quality }}" == "original" ]; then
            echo "output_filename=${{ github.event.inputs.output_filename }}_original.zip" >> $GITHUB_OUTPUT
          else
            echo "output_filename=${{ github.event.inputs.output_filename }}_${{ github.event.inputs.quality }}.zip" >> $GITHUB_OUTPUT
          fi
          echo "No output_filename.txt found, using guessed filename"
        fi
    
    - name: List files for debugging
      run: |
        echo "Current directory contents:"
        ls -la
        echo ""
        echo "Looking for output files:"
        find . -name "${{ github.event.inputs.output_filename }}*" -type f 2>/dev/null || echo "No files found"

    - name: Upload to Artifacts
      if: ${{ github.event.inputs.upload_to == 'artifacts' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.output_filename }}-${{ github.event.inputs.quality }}
        path: |
          ${{ steps.get_output.outputs.output_filename }}
          ${{ github.event.inputs.output_filename }}_${{ github.event.inputs.quality }}.*
          ${{ github.event.inputs.output_filename }}_original.*
        if-no-files-found: warn
    
    - name: Upload to Release
      if: ${{ github.event.inputs.upload_to == 'release' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Movie
        files: |
          ${{ steps.get_output.outputs.output_filename }}
          ${{ github.event.inputs.output_filename }}_${{ github.event.inputs.quality }}.*
          ${{ github.event.inputs.output_filename }}_original.*
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
