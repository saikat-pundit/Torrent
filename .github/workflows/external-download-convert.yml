name: External Video Download Link
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to download'
        required: true
        type: string
        default: 'Paste Your Link'
      output_filename:
        description: 'Output filename (without extension)'
        required: true
        type: string
        default: 'video'
      quality:
        description: 'Video Quality'
        required: true
        type: choice
        default: '480p-av1'
        options:
          - 'original'
          - '480p-av1'
          - '720p-av1'
      upload_to:
        description: 'Upload to'
        required: true
        type: choice
        default: 'release'
        options:
          - 'artifacts'
          - 'release'

jobs:
  convert-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Cache apt packages
      uses: actions/cache@v3
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install FFmpeg and SVT-AV1
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
        # Install SVT-AV1 for AV1 encoding
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y libsvtav1enc-dev libsvtav1dec0
        
        # Verify FFmpeg can use SVT-AV1
        ffmpeg -encoders | grep svtav1 || echo "SVT-AV1 not found in FFmpeg"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run video download and conversion
      env:
        VIDEO_URL: ${{ github.event.inputs.video_url }}
        OUTPUT_FILENAME: ${{ github.event.inputs.output_filename }}
        QUALITY: ${{ github.event.inputs.quality }}
      run: |
        # Create scripts directory if it doesn't exist
        mkdir -p scripts
        # Save the Python script
        cat > scripts/download_and_convert.py << 'EOF'
        # [INSERT THE FIXED PYTHON SCRIPT BELOW]
        EOF
        python scripts/download_and_convert.py
    
    - name: Debug - Show all generated files
      run: |
        echo "=== CURRENT DIRECTORY CONTENTS ==="
        ls -la
        echo ""
        echo "=== VIDEO FILES FOUND ==="
        find . -maxdepth 1 -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" -o -name "*.avi" \) | while read file; do
          size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
          echo "Found: $file (Size: $size bytes)"
        done
        echo ""
        echo "=== ALL FILES WITH VIDEO IN NAME ==="
        ls -la *video* *original* 2>/dev/null || echo "No video files found"
    
    - name: Upload to Artifacts
      if: ${{ github.event.inputs.upload_to == 'artifacts' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.output_filename }}-${{ github.event.inputs.quality }}
        path: |
          *.mp4
          *.mkv
          *.webm
        if-no-files-found: warn
    
    - name: Upload to Release
      if: ${{ github.event.inputs.upload_to == 'release' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Movie-${{ github.run_number }}
        files: |
          *.mp4
          *.mkv
          *.webm
        fail_on_unmatched_files: false
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Cleanup
      if: always()
      run: |
        rm -f temp_* 2>/dev/null || true
        echo "Cleanup completed"
